name: Repara Fotos AI APK CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repara-fotos-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: repara-fotos-ai-debug-apk
          path: repara-fotos-ai/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish/update rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repara-fotos-ai-latest-debug
          name: Repara Fotos AI - Latest Debug
          prerelease: true
          make_latest: false
          files: repara-fotos-ai/app/build/outputs/apk/debug/app-debug.apk
